<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Modal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
}

/* Overlay */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;

    /* IMPORTANT: START VISIBLE */
    opacity:1;
    visibility:visible;
}

/* Modal */
.modal{
    background:#111827;
    padding:40px;
    width:90%;
    max-width:500px;
    border-radius:15px;
    text-align:center;
}

/* Close */
.close-btn{
    position:absolute;
    top:15px;
    right:20px;
    font-size:22px;
    color:white;
    cursor:pointer;
}

.modal h1{
    color:white;
    margin-bottom:10px;
}

.modal p{
    color:#9ca3af;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #374151;
    background:#1f2937;
    color:white;
    outline:none;
}

.submit-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#6366f1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.success-message{
    margin-top:15px;
    color:#22c55e;
    display:none;
}
</style>
</head>

<body>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">

        <h1>Contact Us</h1>
        <p>Please fill your details</p>

        <form id="contactForm">

            <div class="form-group">
                <input type="text" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <input type="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <textarea rows="3" placeholder="Project Details" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>

            <div class="success-message" id="successMessage">
                ✓ Submitted Successfully
            </div>

        </form>

    </div>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();

    const btn = document.querySelector(".submit-btn");
    const success = document.getElementById("successMessage");

    btn.innerText = "Sending...";
    btn.disabled = true;

    setTimeout(function(){
        btn.innerText = "Submitted";
        btn.style.background = "#16a34a";
        success.style.display = "block";

        setTimeout(function(){
            window.location.href = "index.html";
        },1500);

    },1500);
});
</script>

</body>
</html>
