<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Modal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* BODY */
body{
    overflow-x:hidden;
    background:black;
}

/* VIDEO BACKGROUND */
.form-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter: brightness(1.25) contrast(1.05);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.08);
    z-index:-1;
}

/* CENTER */
section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* FORM */
form{
    background:rgba(17,24,39,0.35);
    padding:45px;
    border-radius:20px;
    backdrop-filter: blur(12px);
    width:100%;
    max-width:520px;
    border:1px solid rgba(255,255,255,0.15);
}

h1, p{
    color:white;
    text-align:center;
}

p{
    margin-bottom:20px;
}

/* INPUTS */
input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(0,0,0,0.25);
    color:white;
}

/* BUTTON */
.submit-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(79,70,229,0.4);
}

/* SUCCESS */
.success-message{
    margin-top:15px;
    color:#22c55e;
    text-align:center;
    display:none;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video class="form-video" autoplay muted loop playsinline>
    <source src="https://res.cloudinary.com/dkhmpija5/video/upload/v1772173730/WhatsApp_Video_2026-02-27_at_10.49.22_AM_kuskdz.mp4" type="video/mp4">
</video>

<section>

<form id="contactForm" action="https://formsubmit.co/marcomm@zivanex.com" method="POST">

    <!-- REQUIRED HIDDEN FIELDS -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="New Contact Form Message">
    <input type="hidden" name="_template" value="table">

    <h1>Contact Us</h1>
    <p>Please fill your details</p>

    <!-- FIXED INPUTS (WITH NAME ATTRIBUTES) -->
    <input type="text" name="name" placeholder="Your Name" required>

    <input type="email" name="email" placeholder="Your Email" required>

    <textarea name="message" rows="3" placeholder="Project Details" required></textarea>

    <button type="submit" class="submit-btn">Submit</button>

    <div class="success-message" id="successMessage">
        ✓ Submitted Successfully
    </div>

</form>

</section>

<script>
document.getElementById("contactForm").addEventListener("submit", function(){

    const btn = document.querySelector(".submit-btn");
    const success = document.getElementById("successMessage");

    btn.innerText = "Sending...";
    btn.disabled = true;

    setTimeout(function(){ btn.innerText = "Submitted";
     btn.style.background = "#16a34a"; 
     success.style.display = "block"; 
     
        setTimeout(function(){ 
            window.location.href = "example.html"; 
        },1500);
    },1500);

});
</script>

</body>
</html>
